sample_answer: The discussion focused on antibiotic use. Ravi said he asks for antibiotics for colds,
  but Grace explained that colds are viral. Dr Moreno agreed and said unnecessary prescriptions help resistant
  bacteria spread, adding that resistant infections already cause over a million deaths a year and that
  livestock farming is a major factor.
