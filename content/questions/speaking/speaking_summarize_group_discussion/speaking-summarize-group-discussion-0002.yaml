key_points:
- 'Sara: desalination solves the water shortage'
- 'Tom: costly and energy-intensive; fix leaks and conserve first'
- 'Dr Patel: energy use much lower than in the 1970s but still high'
- Brine is the main environmental risk; combine conservation with desalination
sample_answer: The speakers discussed whether their city should build a desalination plant. Sara supported
  it as a solution to water shortages, while Tom argued it was expensive and energy-intensive and that
  fixing leaks and conserving water should come first. Dr Patel said energy use has fallen greatly but
  is still high, that brine is the main environmental risk, and that most cities need conservation first
  with desalination as a backup.
