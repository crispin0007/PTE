sample_answer: The group discussed the Great Green Wall. Kofi had heard that most trees died, and Hannah
  asked whether that was why the approach changed. Dr Diallo confirmed that early planting often failed
  and that projects now work with local farmers using natural regrowth and water harvesting. Progress
  is real but slow, with about thirty percent restored, and funding and security remain the main obstacles.
