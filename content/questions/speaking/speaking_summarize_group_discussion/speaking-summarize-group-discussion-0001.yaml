key_points:
- 'Maya: nudges like default pensions are cheap and helpful'
- 'Daniel: concern that nudges are manipulative'
- 'Professor Li: no neutral way to present choices; autonomy is the key debate'
- Opt-out remains possible; evidence on effectiveness is mixed
sample_answer: The group discussed whether governments should use nudges. Maya argued that nudges, such
  as making pension saving the default, are cheap and helpful. Daniel worried that they are manipulative
  because people may not notice the choice. Professor Li explained that there is no neutral way to present
  choices, so the real debate is about autonomy, and noted that people can still opt out, although evidence
  of effectiveness is mixed.
