sample_answer: The discussion was about the discovery of penicillin. Ella mentioned Fleming's accidental
  discovery, and Sam noted he could not produce it. Professor Grant explained that Florey and Chain's
  team purified it around 1940 and that American laboratories mass-produced it during the war, showing
  that discoveries depend on teams rather than lone geniuses.
