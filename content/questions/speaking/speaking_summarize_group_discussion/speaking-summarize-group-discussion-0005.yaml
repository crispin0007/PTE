- 'Solutions: washing-machine filters, waste collection, cutting single-use plastics'
sample_answer: The speakers discussed microplastic pollution. Jin thought the microbead ban had solved
  the problem, but Elena pointed out that most microplastics come from larger items breaking down. Professor
  Hart agreed, naming clothing fibres and tyre wear as bigger sources, and suggested washing-machine filters,
  better waste collection and reducing single-use plastics.
