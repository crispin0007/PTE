sample_answer: The discussion was about studying late before exams. Leo said he concentrates best at night,
  but Amina suggested sleep helps memory. Ms Chen agreed with Amina, explaining that people recall more
  after sleeping because the brain replays what they learned, and advised spreading study over several
  days and protecting sleep before an exam.
