key_points:
- Lucas thinks higher river flow means a healthy glacier
- Priya suggests faster melting
- 'Dr Novak: flows rise temporarily, then drop sharply'
- 'Plan now: storage and efficient irrigation'
sample_answer: The speakers discussed higher river flows near a glacier. Lucas assumed this meant the
  glacier was healthy, but Priya suggested it was melting faster. Dr Novak agreed with Priya, explaining
  that rapid melting raises flows temporarily before they drop sharply, and advised communities to plan
  now with water storage and efficient irrigation.
