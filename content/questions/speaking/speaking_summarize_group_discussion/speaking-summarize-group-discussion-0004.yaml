key_points:
- Nadia wants more trees for a hot neighbourhood
- Chris prefers cool roofs because they act immediately
- 'Dr Okafor: roofs act fast, trees take time but add more benefits'
- Best approach combines both, starting with the hottest areas
sample_answer: 'The group discussed how to cool a hot neighbourhood. Nadia wanted more trees, while Chris
  preferred white roofs because they work immediately. Dr Okafor said both are useful: cool roofs act
  quickly and cost less, while trees take time but bring extra benefits such as cleaner air. She recommended
  combining them and starting with the hottest streets.'
