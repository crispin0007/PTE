situation_text: You are organising a farewell party for a colleague who is leaving. Invite another colleague
  and ask them to help with the preparations.
audio: audio/speaking-respond-to-situation-0008.mp3
key_points:
- Invite with date and place
- Explain the occasion
- Ask for specific help
- Thank them
sample_answer: Hi Ben, as you know, Laura is leaving at the end of the month, so we're planning a farewell
  party on Friday the twentieth at six in the meeting room. Would you like to come? Also, could you help
  me collect money for a gift and organise some snacks? Thanks so much, I couldn't do it without you.
