situation_text: Your neighbour plays loud music late every night, and you have important exams this month.
  You decide to speak to your neighbour politely. What would you say?
audio: audio/speaking-respond-to-situation-0003.mp3
key_points:
- Polite greeting
- Describe the problem and its effect
- Make a specific request
- Show willingness to compromise
sample_answer: Hi, I'm from the flat next door. I hope you don't mind me mentioning it, but the music
  has been quite loud late at night recently. I have exams this month and I'm finding it hard to sleep.
  Would you be able to turn it down after ten? I'd really appreciate it, and do let me know if I ever
  disturb you.
