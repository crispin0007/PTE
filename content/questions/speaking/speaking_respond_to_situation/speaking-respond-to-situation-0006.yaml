situation_text: Your manager has asked you to work this Saturday, but you have already booked a trip with
  your family. Explain the situation to your manager.
audio: audio/speaking-respond-to-situation-0006.mp3
key_points:
- Acknowledge the request
- Explain prior commitment
- Offer an alternative
- Remain professional and positive
sample_answer: Thanks for thinking of me for Saturday. Unfortunately, I booked a family trip a few weeks
  ago and it's already paid for. I don't want to leave the team short, though. Could I stay late on Thursday
  and Friday instead, or come in on Sunday? I'm happy to make sure everything is ready before the weekend.
