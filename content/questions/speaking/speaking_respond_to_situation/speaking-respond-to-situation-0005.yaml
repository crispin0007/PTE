situation_text: A new international student in your class seems lost on the first day and does not know
  where the library is. What would you say to help them?
audio: audio/speaking-respond-to-situation-0005.mp3
key_points:
- Friendly greeting
- Give directions
- Offer further help
- Share a useful tip
sample_answer: 'Hi, you look a bit lost. Are you new here? The library is in the building straight ahead,
  next to the cafe. Just go through the main doors and it''s on the second floor. If you like, I can walk
  there with you, I''m heading that way. And tip: the quiet study rooms can be booked online.'
