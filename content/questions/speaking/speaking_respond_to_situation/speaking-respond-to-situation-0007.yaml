situation_text: Your professor gave you a lower mark than you expected on an essay, and you do not understand
  why. You visit your professor during office hours. What would you say?
audio: audio/speaking-respond-to-situation-0007.mp3
key_points:
- Polite opening
- Ask for specific feedback
- Avoid arguing about the mark
- Ask how to improve next time
sample_answer: Good afternoon, Professor. Thank you for seeing me. I was a little surprised by my mark
  on the essay, and I'd like to understand where I lost points. Could you show me which parts were weakest?
  I really want to improve, so any advice on how to approach the next assignment would be very helpful.
