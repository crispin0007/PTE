transcript: 'Your body clock sits in a tiny region of the brain called the suprachiasmatic nucleus. It
  receives signals directly from special cells in your eyes, which is why morning light is so important
  for keeping you in sync. As evening comes, the clock signals the pineal gland to release melatonin,
  which helps prepare you for sleep. Problems arise when we fight this system. Long-term night-shift workers,
  for example, show higher rates of heart disease and diabetes. So the practical advice is simple: get
  daylight in the morning and keep your sleep times regular. Interestingly, teenagers'' clocks naturally
  shift later, which is why some schools have experimented with later start times, with promising results
  for attendance and attention in class.'
key_points:
- Clock located in the suprachiasmatic nucleus
- Light via the eyes keeps it in sync; melatonin at night
- Night-shift work linked to heart disease and diabetes
- 'Advice: morning light, regular sleep'
sample_answer: The speaker explained that the body clock is located in the suprachiasmatic nucleus and
  is kept in time by light detected by the eyes. In the evening it triggers melatonin to prepare the body
  for sleep. Disrupting this system, as in long-term night-shift work, is linked to heart disease and
  diabetes, so the speaker advised getting morning daylight and keeping regular sleep times.
