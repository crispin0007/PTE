transcript: 'The Great Green Wall is one of the most ambitious environmental projects in the world. The
  original idea, agreed in two thousand and five, was a line of trees across the whole width of Africa,
  just south of the Sahara. The targets for twenty-thirty are huge: one hundred million hectares of restored
  land and millions of jobs. In practice, it''s become less of a wall and more of a patchwork of local
  projects, which is probably a good thing. But progress has been slow. Funding promises haven''t always
  been kept, and conflict in parts of the Sahel makes work there dangerous. One encouraging sign is a
  technique where farmers protect the roots of existing trees and let them regrow. It''s cheap, it suits
  local conditions, and it has turned large areas green again.'
key_points:
- 'Agreed in 2005: a tree belt across Africa south of the Sahara'
- '2030 target: 100 million hectares restored'
- Now a patchwork of local projects
- Slowed by unmet funding and conflict
sample_answer: The lecture was about the Great Green Wall, agreed in 2005 as a line of trees across Africa
  south of the Sahara. Its 2030 goals include restoring one hundred million hectares of land and creating
  millions of jobs. It has become a patchwork of local projects rather than a wall, but progress has been
  slow because of unmet funding promises and conflict in the Sahel.
