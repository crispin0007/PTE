transcript: Gutenberg's press, developed around fourteen-forty, is often presented as a single invention,
  but it was really a combination. He adapted the screw press used for making wine, invented a mould for
  casting metal letters quickly, and developed an oil-based ink. The impact was enormous. By fifteen hundred,
  European presses had produced more than twenty million copies. Martin Luther's pamphlets sold in the
  hundreds of thousands, which helped spread the Reformation. Printing also encouraged the use of local
  languages instead of Latin. It's worth adding that Gutenberg himself didn't become rich from his invention.
  He lost control of his workshop in a lawsuit, and others profited from the industry he started.
key_points:
- Around 1440, a combination of technologies
- Screw press, type mould, oil-based ink
- Over 20 million copies by 1500
- Spread the Reformation and local languages
sample_answer: 'The speaker explained that Gutenberg''s press, developed around 1440, combined several
  technologies, including an adapted screw press, a mould for casting metal type and oil-based ink. Its
  impact was huge: European presses produced over twenty million copies by 1500, Luther''s pamphlets helped
  spread the Reformation, and printing encouraged local languages instead of Latin.'
