transcript: 'Glaciers have been retreating almost everywhere since the middle of the nineteenth century,
  and the pace has accelerated. Take Kilimanjaro: about eighty percent of its summit ice disappeared between
  1912 and 2006. Why does this matter? Well, for one thing, melting glaciers add to sea-level rise. But
  for many communities the more immediate issue is water. In the Himalayas and the Andes, glaciers release
  meltwater during the dry season. As they shrink, rivers that hundreds of millions of people rely on
  will become less reliable in summer. There is also a risk of sudden floods, when lakes formed by meltwater
  burst through the loose rock that holds them back. In some valleys, early warning systems have already
  been installed for this reason.'
key_points:
- Retreat since the mid-1800s, now faster
- Kilimanjaro lost about 80% of summit ice
- Contributes to sea-level rise
- Threatens dry-season water in the Himalayas and Andes
sample_answer: The lecture explained that glaciers have been retreating since the mid-nineteenth century
  and the pace is accelerating; for example, Kilimanjaro lost about eighty percent of its summit ice.
  Melting glaciers contribute to sea-level rise, but the more immediate issue is water supply, since communities
  in the Himalayas and Andes depend on glacial meltwater in the dry season.
