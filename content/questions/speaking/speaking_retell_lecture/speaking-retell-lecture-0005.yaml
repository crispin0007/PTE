transcript: Mangroves are trees that grow in the zone between land and sea in the tropics, and they've
  developed some remarkable adaptations. Some species exclude salt at the root; others push special breathing
  roots up out of the mud, because the waterlogged soil has very little oxygen. Many even produce seeds
  that sprout while still on the parent tree, then drop and float away to colonise new shores. These forests
  protect coastlines from storms, act as nurseries for fish, and store a great deal of carbon. Unfortunately,
  large areas have been cleared, often for shrimp farming, although the rate of loss has slowed in recent
  decades. The good news is that restoration works when it's done carefully, especially when local communities
  are involved, since they understand the coastline and benefit directly from healthier forests.
key_points:
- Grow between land and sea in the tropics
- 'Adaptations: salt exclusion, breathing roots, seeds that sprout on the tree'
- 'Benefits: storm protection, fish nurseries, carbon storage'
- Cleared for shrimp farms; loss has slowed
sample_answer: The lecture described mangroves as tropical trees growing between land and sea. They have
  adaptations such as excluding salt, breathing roots and seeds that sprout on the parent tree. Mangroves
  protect coasts from storms, act as nurseries for fish and store large amounts of carbon, but many have
  been cleared for shrimp farming, though the rate of loss has slowed.
