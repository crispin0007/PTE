sample_answer: This line graph compares the share of waste recycled and sent to landfill between 2000
  and 2020. Recycling rose steadily from twelve percent to forty-six percent, while landfill fell from
  seventy-eight percent to thirty percent. The two lines met at forty percent in 2015, after which recycling
  became the more common way of handling waste.
