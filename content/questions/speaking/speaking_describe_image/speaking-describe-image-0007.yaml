sample_answer: This pie chart breaks down household waste by type. Food is the largest category, making
  up thirty-five percent, followed by paper at a quarter of the total. Plastic accounts for eighteen percent
  and glass for twelve percent, while other materials make up the remaining ten percent. This suggests
  that reducing food waste would have the biggest impact.
