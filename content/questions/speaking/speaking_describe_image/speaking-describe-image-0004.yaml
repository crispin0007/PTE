alt_text: 'Process diagram of paper recycling in five steps: collection and sorting, pulping with water,
  cleaning and de-inking, pressing and drying, new paper rolls.'
key_points:
- Five-stage process
- Starts with collection and sorting
- Pulping, then cleaning and de-inking
- Ends with pressing, drying and new rolls
sample_answer: This diagram illustrates how paper is recycled in five stages. First, used paper is collected
  and sorted. It is then mixed with water to form pulp. Next, the pulp is cleaned and the ink is removed.
  After that, it is pressed and dried, and finally it is made into new rolls of paper, ready to be used
  again.
