sample_answer: This diagram shows the water cycle in four stages. Water evaporates from the oceans and
  rises into the atmosphere, where it condenses to form clouds. It then falls back to the ground as rain,
  and finally flows as runoff into rivers, which carry it back to the sea so the cycle can begin again.
