sample_answer: This bar chart shows average nightly sleep across age groups. Teenagers sleep the most,
  at about seven point two hours. Sleep then declines steadily to a low of six and a half hours for people
  in their forties, before rising again to seven point one hours for those over sixty. The overall pattern
  is U-shaped.
