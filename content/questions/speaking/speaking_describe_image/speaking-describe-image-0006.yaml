sample_answer: This line graph shows the number of visitors to a national park across the year. Numbers
  are lowest in January at about twelve thousand, then rise steadily through spring to a peak of sixty-two
  thousand in July. After the summer, visitor numbers fall sharply, reaching fifteen thousand by November.
  Overall, the park is far busier in summer than in winter.
