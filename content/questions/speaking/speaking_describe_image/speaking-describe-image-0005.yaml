sample_answer: This bar chart compares how two age groups spend their week. Study or work takes the most
  time in both groups, but people aged twenty-five to thirty-four spend forty-two hours, ten more than
  the younger group. In contrast, eighteen to twenty-four year olds spend more time on screens and socialising.
  Exercise is the smallest category for both, at around four to five hours.
