transcript: Coral reefs are among the most diverse ecosystems on Earth. When water temperatures remain
  high for several weeks, corals expel the algae that give them colour and food. Without these algae,
  the coral turns white and may eventually die. Protecting reefs therefore depends on keeping ocean temperatures
  under control.
