transcript: Coral reefs support around a quarter of all marine species, even though they cover only a
  small part of the ocean floor. Corals get most of their {{b1}} from algae living inside them. When the
  water becomes too {{b2}}, the coral expels the algae and turns white. This is called {{b3}}. If conditions
  improve quickly, the coral can {{b4}}, but long periods of heat often kill it. Scientists now monitor
  sea temperatures from space to predict where it will happen next.
