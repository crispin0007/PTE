transcript: Many dry coastal countries now rely on the sea for their drinking water. In reverse osmosis,
  seawater is pushed through a {{b1}} under high {{b2}}. Water passes through, but most of the salt is
  left {{b3}}. The salty waste, called {{b4}}, must be disposed of carefully. Even so, the energy needed
  for the process has fallen dramatically over the past fifty years.
