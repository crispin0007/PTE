transcript: The electrical telegraph was one of the most important inventions of the nineteenth century.
  In 1844, Samuel Morse sent a {{b1}} from Washington to Baltimore. The code he helped develop used short
  and long {{b2}}. Twenty-two years later, a cable across the Atlantic {{b3}} Europe and America, reducing
  communication time from weeks to {{b4}}. For the first time, news could travel faster than people.
