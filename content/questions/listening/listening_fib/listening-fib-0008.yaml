transcript: Land degradation is a serious problem across the Sahel, the dry region south of the Sahara.
  The Great Green Wall aims to {{b1}} one hundred million hectares of land across Africa. At first, the
  plan focused on planting {{b2}}, but many did not survive. Today, projects work closely with local {{b3}}
  and use methods that help land {{b4}} naturally. Progress has been slow, but some areas are now visibly
  greener than they were twenty years ago.
