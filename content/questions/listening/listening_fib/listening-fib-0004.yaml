transcript: Plastic pollution is not only a problem of bottles and bags floating in the sea. Microplastics
  are tiny {{b1}} of plastic. Many come from synthetic clothing, which releases fibres every time it is
  {{b2}}. Others come from car {{b3}}. Scientists are still trying to understand their {{b4}} on human
  health. Some countries have already banned tiny plastic beads in cosmetics, but that is only a small
  part of the problem.
