transcript: Behavioural economists study how people actually make decisions, rather than how they ought
  to. A nudge changes how a choice is {{b1}} without taking any options away. A common example is a {{b2}},
  the option people get if they do nothing. Critics question whether nudges are {{b3}}, and some argue
  that the {{b4}} for them is weaker than claimed. Even so, many governments now have teams that use these
  ideas in public policy.
