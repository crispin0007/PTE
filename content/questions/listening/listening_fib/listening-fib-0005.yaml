transcript: Almost every living thing, from plants to people, follows daily patterns of activity and rest.
  Our internal clock follows a cycle of about twenty-four {{b1}}. It is reset each day mainly by {{b2}}.
  In the evening, the brain releases a hormone called {{b3}}, which helps us feel {{b4}}. That is why
  using bright screens late at night can make it harder to fall asleep.
