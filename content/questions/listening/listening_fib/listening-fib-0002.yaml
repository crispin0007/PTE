transcript: Today we take printed books for granted, but in the middle of the fifteenth century they were
  a revolutionary new technology. Before printing, books in Europe were copied by {{b1}}, which made them
  rare and expensive. Gutenberg's press made it possible to produce identical copies {{b2}}. Within fifty
  years, millions of books had been printed, and {{b3}} began to rise across the {{b4}}. The new technology
  also helped scholars share ideas much more widely.
