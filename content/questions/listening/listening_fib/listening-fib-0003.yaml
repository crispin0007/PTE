transcript: Some animals travel remarkable distances every year, but one small seabird travels further
  than any other. The Arctic tern breeds in the far {{b1}} and spends the rest of the year near Antarctica.
  Scientists used small tracking {{b2}} to follow the birds and discovered that their journeys were much
  {{b3}} than expected. Some birds live for more than {{b4}} years. Over a lifetime, the total distance
  it flies is roughly equal to three return trips to the Moon.
