transcript: Let's talk about coral bleaching, which has become one of the clearest signs of ocean warming.
  Corals rely on tiny algae living in their tissues. The algae photosynthesise and give the coral most
  of its energy. When the water stays even about one degree above its normal summer maximum for several
  weeks, that partnership breaks down. The coral expels the algae and turns white. Now, a bleached coral
  isn't dead. If temperatures drop quickly, the algae can return. But if the heat lasts, the coral starves.
  The first global bleaching event was recognised in 1998, and since then they've become more frequent.
  The most recent one, starting in 2023, is the fourth. The worry is that reefs are no longer getting
  enough time to recover between events. To give a sense of scale, during the most recent event, bleaching-level
  heat stress was recorded on reefs in more than eighty countries. Some reefs do show signs of resilience,
  and scientists are studying heat-tolerant corals, but almost everyone agrees that the long-term answer
  depends on limiting ocean warming.
sample_answer: The speaker explained that coral bleaching occurs when warm water breaks the partnership
  between corals and the algae that feed them, causing corals to expel the algae and turn white. Bleached
  corals can recover if temperatures fall quickly, but global events have become more frequent, leaving
  too little recovery time.
