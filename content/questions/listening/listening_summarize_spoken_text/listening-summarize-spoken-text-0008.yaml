transcript: When people hear the phrase ocean acidification, they often imagine the sea turning into acid.
  That's not what's happening. Seawater is still alkaline, with a pH a little above eight. What's changing
  is the direction. Since the nineteen-fifties, average surface pH has fallen from about eight point one
  five to eight point oh five. That sounds tiny, but because the scale is logarithmic, it means around
  twenty-five percent more hydrogen ions. Those extra ions reduce the carbonate that corals, shellfish
  and some plankton need to build their skeletons. In one experiment on the Great Barrier Reef, conditions
  expected later this century reduced coral growth by about a third. These organisms matter far beyond
  the reef. Tiny shell-building plankton are food for fish, and oysters and mussels support coastal fisheries,
  so changes at the bottom of the food web can ripple upwards in ways that are still hard to predict.
sample_answer: The lecture clarified that ocean acidification does not mean the sea is becoming acidic;
  seawater remains alkaline, but its pH has fallen by about 0.1 since the 1950s, a roughly twenty-five
  percent rise in hydrogen ions that reduces the carbonate shell-building organisms need, with experiments
  showing much slower coral growth.
