transcript: Your body clock affects almost everything, from when you feel sleepy to how well you digest
  food. The good news is that small changes in daily habits can help keep it running smoothly. If you
  want to keep your body clock healthy, there are a few practical steps. Get outside in daylight early
  in the day, because morning light is the strongest signal for setting the clock. Try to go to bed and
  wake up at similar times, even at weekends. Reduce bright screens in the hour before bed, since light
  in the evening delays melatonin. And be careful with large meals late at night, because eating also
  sends timing signals to the body.
