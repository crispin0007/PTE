transcript: Mangroves are trees that grow along tropical coastlines, in the zone that is flooded by the
  tide twice a day. Few trees can survive there, because seawater would normally dehydrate and poison
  them. Mangroves have some remarkable ways of coping with salt water. Some species, like the red mangrove,
  block most of the salt at their roots. Others take the salt in but then get rid of it through special
  glands on their leaves; you can sometimes see salt crystals on them. And because the mud they grow in
  has very little oxygen, some mangroves send up roots that stick out of the mud like pencils, so they
  can take in air directly.
question: Which adaptations of mangroves are described?
options:
- Blocking salt at the roots
- Storing fresh water in their trunks
- Removing salt through their leaves
- Roots that take in air above the mud
- Closing their leaves at high tide
answers:
- 0
- 2
- 3
