transcript: 'Since the middle of the nineteenth century, most of the world''s mountain glaciers have been
  shrinking, and in recent decades the pace has increased. So what does this mean for people? Glacier
  retreat affects people in several ways. Most obviously, it adds to sea-level rise, which threatens coastal
  cities. In mountain regions, it changes water supply: rivers that relied on summer meltwater become
  less reliable. There are also hazards. As glaciers shrink, they can leave behind lakes held back by
  unstable piles of rock, and if those dams fail, the floods can be devastating. Tourism can suffer too,
  in places where glaciers are the attraction.'
question: Which effects of glacier retreat does the speaker mention?
options:
- Rising sea levels
- Less reliable river flows
- Increased snowfall in valleys
- Floods from glacial lakes
- Damage to coral reefs
answers:
