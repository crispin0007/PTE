transcript: 'On a hot summer night, the difference between a city centre and the surrounding countryside
  can be several degrees. Researchers call this the urban heat island effect, and it has been studied
  for about two hundred years. So why exactly are cities warmer? There are several causes working together.
  First, materials. Asphalt and concrete absorb a lot of sunlight and hold on to that heat, releasing
  it at night. Second, there''s simply less vegetation, so we lose the cooling that comes from shade and
  from plants releasing water. Third, the shape of the city: tall buildings trap heat and block the wind.
  And finally, there''s waste heat from cars, air conditioners and industry, although that''s usually
  a smaller factor than the change in surfaces.'
question: According to the speaker, which factors make cities warmer?
options:
- Surfaces that store heat
- Less vegetation
- Higher rainfall in cities
- Tall buildings that block wind
- Thinner air above cities
answers:
- 0
- 1
- 3
