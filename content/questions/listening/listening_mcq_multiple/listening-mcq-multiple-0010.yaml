transcript: When Alfred Wegener presented his theory of continental drift in 1912, most geologists dismissed
  it. Looking back, it's surprising how much evidence he had already gathered. Wegener's evidence for
  continental drift was actually quite strong. The coastlines of South America and Africa fit together
  like puzzle pieces. The same fossil species, including a freshwater reptile that couldn't have swum
  an ocean, appeared on both continents. Rock formations matched across the Atlantic. And there were signs
  of ancient glaciers in places that are now tropical. What he lacked was a mechanism.
question: Which pieces of evidence did Wegener use, according to the speaker?
options:
- Matching coastlines
- Identical fossils on different continents
- Magnetic stripes on the sea floor
- Similar rock formations
- Satellite measurements
answers:
- 0
- 1
- 3
