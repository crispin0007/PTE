transcript: Pollinators are under pressure across the world, and much of the land they live on is farmland.
  That means farmers are in a strong position to help, often at quite a low cost. Farmers can do quite
  a lot to support pollinators. Leaving strips of wildflowers along field edges gives insects food throughout
  the season. Keeping hedgerows provides nesting sites. Reducing pesticide use, or at least avoiding spraying
  when crops are in flower, protects bees directly. Some farms also put out nesting boxes for solitary
  bees, which are often better pollinators of certain crops than honey bees.
question: What actions for farmers does the speaker suggest?
options:
- Planting wildflower strips
- Removing hedgerows
- Avoiding spraying during flowering
- Providing nesting boxes for solitary bees
- Replacing crops with grass
