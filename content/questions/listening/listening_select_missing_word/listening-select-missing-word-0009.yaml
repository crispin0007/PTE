transcript: Very few merchants ever travelled the whole length of the Silk Road. Instead, goods moved
  in short stages between trading cities. Goods on the Silk Road were passed from one merchant to the
  next, and each trader added a profit. So by the time Chinese silk reached Rome, it had become
options:
