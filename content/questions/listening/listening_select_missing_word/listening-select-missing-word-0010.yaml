transcript: The ocean has absorbed around a quarter of the carbon dioxide released by human activity,
  and this is changing its chemistry. When the ocean absorbs carbon dioxide, there are fewer carbonate
  ions available in the water. Corals and shellfish need these ions, so lower carbonate levels make it
  harder for them to
options:
- find food
- build their skeletons
- move to deeper water
- reproduce in winter
answer: 1
