transcript: Doctors are often asked to prescribe antibiotics for coughs and colds, and many patients feel
  disappointed when they leave without them. Antibiotics only work against bacteria. Colds and flu are
  caused by viruses, so taking antibiotics for them doesn't help the patient and only gives resistant
  bacteria
