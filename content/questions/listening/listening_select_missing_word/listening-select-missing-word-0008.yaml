transcript: When a new medicine is tested, researchers need to make sure that any improvement is caused
  by the drug itself, not by what patients or doctors expect. In a well-designed trial, neither the patients
  nor the doctors know who is receiving the real drug. This is known as a double-blind design, and its
  purpose is to
options:
- save money on medicine
- make trials shorter
- increase side effects
- reduce the influence of expectations
answer: 3
