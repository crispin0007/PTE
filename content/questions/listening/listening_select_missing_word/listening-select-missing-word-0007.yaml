transcript: Coastal communities in the tropics have long relied on mangrove forests for fish, firewood
  and building materials. Recently, scientists have studied another benefit. Mangrove roots slow down
  waves before they reach the shore. During tropical storms, villages protected by healthy mangrove forests
  often suffer
