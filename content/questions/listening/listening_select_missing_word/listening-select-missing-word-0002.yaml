transcript: In the early twentieth century, Alfred Wegener noticed that the coastlines of South America
  and Africa seemed to fit together, and he found matching fossils on both continents. Wegener had strong
  evidence that the continents had once been joined. However, he could not explain what force could move
  them, and so for decades most geologists
options:
- rejected his ideas
- accepted his theory
- measured the plates
- ignored the fossils
