transcript: Most earthquakes happen along the boundaries between tectonic plates. At transform boundaries,
  like the San Andreas Fault in California, two plates slide past each other. They don't move smoothly;
  friction locks them together, and stress builds up over decades or centuries. When the rock finally
  gives way, the plates jump suddenly, releasing that energy as an earthquake. Scientists cannot yet predict
  exactly when this will happen, but they can map where the risk is highest.
options:
- The San Andreas Fault is where two plates move apart.
- Earthquakes at transform boundaries occur when stress built up by locked, sliding plates is suddenly
  released.
- Most earthquakes occur far from plate boundaries.
- Plates at transform boundaries move smoothly and constantly.
answer: 1
