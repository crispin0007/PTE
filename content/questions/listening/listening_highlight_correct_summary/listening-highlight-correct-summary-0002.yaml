transcript: Kilimanjaro's ice cap is a striking example of glacier loss. Between 1912 and 2006, around
  eighty percent of the summit ice disappeared. Interestingly, the main cause there isn't only warmer
  air; reduced snowfall and drier conditions also play a role. But globally, the overwhelming driver of
  glacier retreat is rising temperatures caused by greenhouse gas emissions, and almost every glacier
  on Earth is now losing more ice than it gains.
options:
- Glacier retreat is caused mainly by reduced snowfall rather than temperature.
- Kilimanjaro has lost most of its summit ice, partly through drier conditions, while worldwide retreat
  is mainly driven by warming from emissions.
- Only a few glaciers around the world are losing ice.
- Kilimanjaro's glaciers are growing because of increased snowfall.
answer: 1
