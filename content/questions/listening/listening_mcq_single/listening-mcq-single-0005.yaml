transcript: Researchers who study decision-making have shown that small changes in how options are presented
  can have large effects on what people choose. One study looked at electricity customers in Germany.
  When the green, renewable tariff was the default option, most people stayed with it. When the standard
  tariff was the default, few people chose the green one, even though the options and prices were the
  same.
question: What does the study show?
options:
- Green tariffs are always more popular
- Germans dislike renewable energy
- People prefer cheaper electricity
- The default option strongly influences choices
answer: 3
