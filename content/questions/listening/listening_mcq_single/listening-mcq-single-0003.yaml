transcript: Scientists have known for centuries that plants and animals follow daily rhythms, but for
  a long time nobody understood how these rhythms were produced inside cells. In 2017, the Nobel Prize
  in Physiology or Medicine went to Jeffrey Hall, Michael Rosbash and Michael Young. Working with fruit
  flies, they identified a gene whose protein builds up in cells at night and breaks down during the day.
  This rise and fall forms a feedback loop that keeps time, and similar mechanisms were later found in
  humans.
question: What did the prize-winning research discover?
options:
- A molecular feedback loop that keeps biological time
- That fruit flies do not sleep
- How melatonin is made in plants
- A cure for insomnia
