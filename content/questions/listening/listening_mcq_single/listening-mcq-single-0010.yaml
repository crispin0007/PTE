transcript: Early tree-planting efforts in the Sahel often failed, because many seedlings died during
  the long dry season. One of the most successful techniques in the Sahel is surprisingly simple. Farmers
  protect the stumps and roots of trees already in their fields, allowing them to regrow, instead of planting
  new seedlings. This approach is cheap, and the regrown trees survive much better than planted ones.
question: Why is the technique described as successful?
options:
- It requires large machines
- It removes all existing trees
- It uses imported tree species
- It is cheap and the trees survive well
answer: 3
