transcript: The Arctic tern is famous for making the longest migration of any animal, travelling between
  the Arctic and the Antarctic every year. Earlier estimates of the Arctic tern's migration were based
  on a straight line between the Arctic and Antarctica. Tracking showed the birds take an S-shaped route
  over the Atlantic. That seems inefficient, but it lets them ride the prevailing winds, saving energy
  even though they fly further.
question: Why do Arctic terns follow an S-shaped route?
options:
- To stay close to land
- To avoid predators
- To use the prevailing winds
- To find breeding partners
answer: 2
