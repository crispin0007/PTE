transcript: Coral bleaching can now be predicted with reasonable accuracy, which gives reef managers time
  to prepare. Scientists monitor reefs using satellite measurements of sea surface temperature. They track
  how much heat has accumulated above the normal summer maximum over the past twelve weeks. When this
  accumulated heat passes certain thresholds, bleaching becomes likely, and above a higher threshold,
  widespread coral death is expected.
question: What do scientists measure to predict bleaching?
options:
- The colour of the water from space
- The accumulated heat above normal summer temperatures
- The amount of rainfall over the ocean
- The number of fish on a reef
answer: 1
