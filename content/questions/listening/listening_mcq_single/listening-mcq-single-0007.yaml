transcript: Governments have tried several approaches to reduce plastic pollution, with mixed results.
  In 2015, the United States passed a law banning plastic microbeads in rinse-off cosmetics such as face
  washes and toothpaste. It was a popular measure, but some manufacturers simply switched to other small
  plastic ingredients, like glitter, which the law didn't cover.
question: What weakness of the 2015 law does the speaker point out?
options:
- Manufacturers used other plastic ingredients it did not cover
- It applied only to toothpaste
- It was never enforced
- It banned too many products
