transcript: We usually think of the telegraph as a way of sending news, but scientists found other uses
  for it too. The telegraph also changed how time was measured. Astronomers could send a time signal from
  one observatory to another and compare local clocks instantly. Because the difference in local time
  corresponds to a difference in longitude, this gave far more accurate maps.
question: How did the telegraph improve maps?
options:
- It helped measure longitude through time signals
- It replaced the need for observatories
- It recorded the height of mountains
- It allowed photographs to be sent
