transcript: One of the most discussed claims about bilingualism is that it may delay the symptoms of dementia.
  A 2012 brain-imaging study compared bilingual and monolingual Alzheimer's patients with similar symptoms.
  The bilingual patients actually had more physical damage in their brains. The researchers concluded
  that bilingualism doesn't prevent the disease but may help the brain compensate for longer.
question: What did the researchers conclude?
options:
- Monolingual patients recovered faster
- Bilingualism prevents Alzheimer's disease
- Bilingualism may help the brain cope with damage for longer
- Bilingual patients had less brain damage
answer: 2
