transcript: When penicillin was first shown to cure infections, the problem was that only tiny amounts
  could be made. During the Second World War, finding a way to produce more became a priority. One reason
  penicillin production succeeded in the United States was a better strain of mould. Researchers in Peoria,
  Illinois, searched widely and found a high-yielding strain on a mouldy cantaloupe melon from a local
  market. Combined with deep-tank fermentation, it allowed output to increase enormously.
question: Where was the high-yielding mould strain found?
options:
- In Fleming's original sample
- In a hospital laboratory
- On a melon from a market
- In soil from a farm
answer: 2
