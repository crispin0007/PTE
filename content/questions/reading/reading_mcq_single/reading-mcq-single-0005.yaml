passage: Behavioural economists have shown that the way a choice is presented can change what people choose,
  even when the options themselves stay the same. In one study, more households ended up on a renewable
  electricity tariff simply because it was the default, the option they received if they did nothing.
  Governments took notice. In 2010 the United Kingdom set up a small team in the Cabinet Office to apply
  such insights to public policy. Critics, however, argue that the evidence for nudging is weaker than
  its supporters claim once studies that found no effect, and were never published, are taken into account.
question: What concern do critics raise, according to the passage?
options:
- Nudges are too expensive for governments to use.
- Defaults remove people's freedom to choose.
- Published studies may overstate how well nudges work.
- Renewable electricity tariffs are unpopular with households.
answer: 2
