passage: The electrical telegraph changed more than the speed of communication. Railway companies were
  among the first customers, using it to signal when lines were clear and so to run more trains safely.
  Astronomers and surveyors used telegraphed time signals to compare clocks in distant places, which allowed
  longitude to be measured more accurately. Newspapers, which had relied on letters carried by ship, could
  now print reports from other continents within a day. Governments, too, found they could direct armies
  and officials far more closely than before.
question: According to the passage, which groups made use of the telegraph?
