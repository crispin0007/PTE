passage: Small electronic tags weighing only a gram or two have transformed what is known about the Arctic
  tern. Before tracking, scientists estimated its yearly journey from the straight-line distance between
  its Arctic breeding colonies and its Antarctic feeding grounds. Tagged birds revealed that they zigzag
  across the Atlantic, following wind systems that save energy, and that the real round trip can be more
  than 70,000 kilometres. Because the birds spend the northern summer in the Arctic and the southern summer
  near Antarctica, they experience more daylight than any other animal. Many live for twenty years or
  more.
question: What did tracking studies reveal about Arctic terns?
options:
- Their routes are much longer than a straight line.
- They fly directly against the wind.
- They follow wind patterns that save energy.
- They spend winter in the Arctic.
- They rarely live beyond five years.
