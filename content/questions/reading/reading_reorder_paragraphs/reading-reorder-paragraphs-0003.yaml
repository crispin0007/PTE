paragraphs:
- In 1837, two inventors in Britain and one in the United States patented electrical telegraphs.
- The American, Samuel Morse, sent his famous first public message between Washington and Baltimore in
  1844.
- Within a few years, telegraph lines ran alongside railways across both countries.
- The greatest challenge was the Atlantic Ocean, where early cables failed after a short time.
- Finally, in 1866, a durable cable was laid, connecting the two continents almost instantly.
