paragraphs:
- In 1928, Alexander Fleming returned from holiday to find mould growing on one of his bacterial cultures.
- Around the mould, the bacteria had died, and Fleming named the substance responsible penicillin.
- However, he was unable to purify it in useful amounts, and interest in the discovery faded.
- A decade later, a team in Oxford led by Howard Florey and Ernst Chain succeeded in concentrating it.
- Their work led to mass production during the Second World War and a shared Nobel Prize in 1945.
