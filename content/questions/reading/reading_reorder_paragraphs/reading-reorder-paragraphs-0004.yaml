paragraphs:
- Corals depend on tiny algae living in their tissues for most of their food.
- When sea temperatures stay too high for several weeks, this relationship breaks down.
- The coral expels the algae and, without their pigments, turns white.
- If cool conditions return quickly, the algae can recolonise the coral and it may survive.
- If the heat persists, however, the coral is likely to starve or succumb to disease.
