paragraphs:
- In the second century BCE, the Chinese envoy Zhang Qian travelled west into Central Asia.
- His reports encouraged the Han dynasty to extend its control along the routes he had followed.
- As a result, caravans could move more safely between China and the cities further west.
- Over the following centuries, these routes carried not only silk but also religions such as Buddhism.
- Much later, in 1877, a German geographer gave the network the name by which it is now known.
