paragraphs:
- In 1912, Alfred Wegener proposed that the continents had once formed a single landmass.
- Most of his colleagues dismissed the idea because he could not explain how continents could move.
- After the Second World War, surveys of the ocean floor revealed strange magnetic stripes on either side
  of mid-ocean ridges.
- These stripes showed that new crust was being created at the ridges and pushed outwards.
- This discovery provided the missing mechanism, and by the late 1960s plate tectonics had become widely
  accepted.
