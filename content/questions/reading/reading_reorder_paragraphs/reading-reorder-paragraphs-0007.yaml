paragraphs:
- Each winter, snow falls on a glacier's upper slopes and is slowly compressed into ice.
- Each summer, some of that ice melts at the glacier's lower end.
- For a glacier to remain the same size, these gains and losses must balance.
- Today, however, warmer temperatures mean that melting exceeds snowfall on almost every glacier.
- The result is a steady retreat that is visible in photographs taken only a few decades apart.
