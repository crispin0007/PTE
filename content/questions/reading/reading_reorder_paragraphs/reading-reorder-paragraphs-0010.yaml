paragraphs:
- In 2005, leaders of countries bordering the Sahara agreed on a bold plan to halt the spread of the desert.
- The African Union endorsed the idea two years later, and international donors pledged support.
- Early efforts focused on planting trees, but many seedlings died in the dry conditions.
- Planners therefore shifted towards projects designed with local farmers, such as rainwater harvesting.
- Despite this change, funding shortfalls and insecurity have kept progress well behind the original targets.
