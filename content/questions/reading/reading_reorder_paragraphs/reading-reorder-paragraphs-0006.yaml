paragraphs:
- In a reverse osmosis plant, seawater is first filtered to remove sand and larger particles.
- It is then pumped at high pressure against a semi-permeable membrane.
- Water molecules pass through the membrane, but most of the dissolved salt cannot.
- The fresh water on the other side is treated with minerals so that it is safe and pleasant to drink.
- Meanwhile, the concentrated brine left behind must be returned to the sea with care.
