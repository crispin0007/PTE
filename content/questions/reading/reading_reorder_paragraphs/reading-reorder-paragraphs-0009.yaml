paragraphs:
- When we learn something new, the memory is at first fragile and easily disturbed.
- Over the following hours, it must be stabilised in a process called consolidation.
- Much of this work seems to happen while we sleep, when the brain replays recent experiences.
- This is why a night's sleep after studying often improves recall the next day.
- Conversely, staying awake all night can leave newly learned material poorly stored.
