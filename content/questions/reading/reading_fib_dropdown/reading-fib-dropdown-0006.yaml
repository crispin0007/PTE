passage: The body keeps time with an internal clock that runs on a cycle of roughly 24 hours. In mammals,
  the master clock is {{b1}} in a small region of the brain called the suprachiasmatic nucleus. Light
  reaching the eyes is the main signal that keeps this clock {{b2}} with day and night. When people work
  night shifts for many years, the clock and their daily routine can fall out of step, a {{b3}} that has
  been linked to several health problems.
