passage: Reef-building corals live in close {{b1}} with tiny algae that sit inside their tissues. The
  algae use sunlight to make food, and they {{b2}} most of the energy the coral needs. When the water
  becomes too warm, this arrangement {{b3}}, the algae are expelled, and the coral turns pale. A bleached
  coral is not yet dead, but it is {{b4}} to starvation and disease.
