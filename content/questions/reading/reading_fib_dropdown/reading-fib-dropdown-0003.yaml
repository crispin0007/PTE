passage: Cities are usually warmer than the countryside around them, and the difference is often {{b1}}
  at night. Dark roads and roofs absorb sunlight during the day and {{b2}} that heat after sunset. Because
  cities have fewer trees, they also lose the cooling {{b3}} of shade and evaporation. Planting trees
  and using lighter roofing materials are two {{b4}} ways to reduce the problem.
