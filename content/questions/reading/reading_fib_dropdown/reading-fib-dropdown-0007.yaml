passage: 'The Silk Road was not a single road but a {{b1}} of trade routes that linked China with Central
  Asia, the Middle East and Europe for more than 1,500 years. Silk gave the routes their name, but merchants
  also {{b2}} tea, porcelain, horses and gold. Just as important was the {{b3}} of ideas: religions such
  as Buddhism travelled along the same paths as the goods.'
