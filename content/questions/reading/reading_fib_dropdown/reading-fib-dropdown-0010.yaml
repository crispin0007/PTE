passage: Students who stay up all night before an exam may be working against themselves. Research going
  back to the 1920s has found that people {{b1}} new information better after a period of sleep than after
  the same time spent awake. During sleep, the brain appears to {{b2}} recent experiences and link them
  to existing knowledge. Sleep deprivation, by contrast, reduces recall and can even make people more
  {{b3}} in answers that are wrong.
