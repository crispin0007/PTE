passage: The Arctic tern makes the longest {{b1}} of any animal. Each year it flies from its breeding
  grounds in the far north to the waters around Antarctica and back again. Tracking devices have shown
  that the birds follow winding routes to take {{b2}} of the winds, so their real journeys are much longer
  than a {{b3}} line between the two regions would suggest.
