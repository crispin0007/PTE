passage: Johannes Gutenberg did not invent every part of his printing press. His achievement was to {{b1}}
  existing tools, such as the screw press, with new ones, including a hand mould for casting metal type.
  The result was so {{b2}} that by 1480 printers were working in more than a hundred European towns. Cheaper
  books helped literacy to {{b3}} and gradually {{b4}} the position of Latin as the language of scholars.
