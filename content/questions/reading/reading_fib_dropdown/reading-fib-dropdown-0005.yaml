passage: 'Mangrove trees grow where few other plants can {{b1}}: in salty, waterlogged mud along tropical
  coasts. Some species filter most of the salt out at their roots, while others grow special roots that
  stick up into the air to {{b2}} oxygen. Although mangrove forests cover only a tiny share of the world''s
  coastline, they hold a {{b3}} amount of coastal carbon, which makes their {{b4}} important for the climate.'
