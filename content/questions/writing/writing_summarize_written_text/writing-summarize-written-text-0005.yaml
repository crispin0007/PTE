passage: 'Circadian rhythms are physical, mental and behavioural changes that follow a cycle of roughly
  twenty-four hours. They are found in almost all living things, from bacteria to humans, and they allow
  organisms to anticipate regular changes in their environment rather than merely react to them. In mammals,
  a master clock in a small region of the brain coordinates clocks found in tissues throughout the body.
  Although this clock runs on its own, it must be adjusted every day, and light is the most important
  signal for doing so: specialised cells in the retina send information about light levels directly to
  the brain''s clock. In the evening, the clock triggers the release of melatonin, a hormone that promotes
  sleep. In 2017, the Nobel Prize in Physiology or Medicine was awarded to three scientists who identified
  the genes and proteins that drive this clock at the cellular level. Modern lifestyles often disrupt
  circadian rhythms. Artificial light at night, irregular sleep schedules and long-distance travel all
  push the internal clock out of step with the external day, and long-term shift work has been associated
  with higher risks of heart disease, diabetes and other conditions.'
sample_answer: Circadian rhythms are roughly daily cycles, controlled in mammals by a brain clock reset
  mainly by light and explained at the molecular level by Nobel-winning research, and modern habits such
  as night-time light and shift work disrupt them with possible health risks.
