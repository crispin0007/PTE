passage: Pollinators such as bees, butterflies, moths, beetles and some birds and bats carry pollen between
  flowers, allowing plants to produce seeds and fruit. The great majority of wild flowering plants depend
  at least partly on animal pollination, as do many crops, especially fruits, nuts and vegetables. Over
  recent decades, scientists have recorded declines in the abundance and diversity of many pollinators
  in several regions of the world. The causes are numerous and often interact. Intensive agriculture has
  removed hedgerows and wildflower meadows that provided food and nesting sites. Some pesticides, particularly
  the group known as neonicotinoids, have been linked to harm in bees' navigation and immune systems,
  and the European Union restricted their outdoor use. Managed honey bee colonies have suffered from parasites
  such as the varroa mite and the viruses it spreads. Climate change is altering when plants flower and
  where insects can live, sometimes breaking the timing between them. Although the world's staple grains
  would not disappear without pollinators, the loss of fruit and vegetable harvests would make diets less
  nutritious and food more expensive, which is why many countries now support pollinator-friendly farming.
sample_answer: Many pollinators are declining because of habitat loss, pesticides such as neonicotinoids,
  parasites and climate change, which would not eliminate staple grains but would reduce fruit and vegetable
  harvests, so many countries are promoting pollinator-friendly farming.
