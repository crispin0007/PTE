passage: 'The Great Green Wall is an African-led initiative to restore degraded land across the Sahel,
  the semi-arid region along the southern edge of the Sahara. It was approved by Sahel and Sahara states
  in 2005 and endorsed by the African Union in 2007. The original concept was a continuous belt of trees
  about fifteen kilometres wide and nearly eight thousand kilometres long, stretching from Senegal in
  the west to Djibouti in the east. Experience soon showed that mass tree planting in harsh conditions
  often failed, and the initiative evolved into a broader programme of land restoration that supports
  local farming practices, water management and natural regeneration. Its targets for 2030 are ambitious:
  to restore one hundred million hectares of land, capture a quarter of a billion tonnes of carbon dioxide
  and create millions of jobs. Progress, however, has been slower than hoped. A United Nations assessment
  in 2020 found that only a small proportion of the target had been achieved, although later estimates
  suggested that around thirty percent of the land goal had been restored by 2024. The main obstacles
  include unfulfilled funding commitments, weak coordination between countries, and insecurity caused
  by armed groups in parts of the region.'
sample_answer: The Great Green Wall, launched in 2005 as a tree belt across the Sahel, has become a broader
  land restoration programme with ambitious 2030 targets, but funding gaps, weak coordination and insecurity
  have kept progress well behind schedule.
