prompt: Globalisation is causing many local languages and traditions to disappear. Is this a problem,
  and what can be done about it?
sample_answer: |-
  Globalisation has connected the world through trade, travel and the internet, but it has also placed many local languages and traditions under threat. I believe this loss is a serious problem, although it can be slowed through deliberate action.

  Languages and traditions are more than means of communication or entertainment. They contain knowledge accumulated over generations, including ways of understanding local plants, landscapes and history. When a language disappears, much of this knowledge disappears with it. Cultural diversity also enriches human life as a whole, offering different perspectives on how to live.

  The causes of decline are understandable. Young people often adopt dominant languages such as English because they offer better education and job opportunities, and global media can make local customs seem old-fashioned. Migration to cities also separates families from the communities where traditions were practised.

  Nevertheless, several measures can help. Schools can teach in local languages alongside national or international ones, so that children do not have to choose. Governments and communities can record elders, create dictionaries and support local festivals. Technology itself can be part of the solution, through apps, online courses and media produced in minority languages.

  In conclusion, the disappearance of local cultures represents a real loss for humanity, but with education, documentation and community support, globalisation and cultural diversity can coexist.
