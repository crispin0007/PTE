prompt: Social media has had a more negative than positive effect on young people. Do you agree or disagree?
  Support your answer with reasons and examples.
sample_answer: |-
  Social media has become a central part of young people's lives. While there are legitimate concerns about its effects, I disagree that its impact has been mainly negative, because it also provides significant opportunities when used thoughtfully.

  Critics rightly point to several problems. Excessive use can disrupt sleep and reduce time spent on study and physical activity. Constant comparison with carefully edited images may lower self-esteem, and cyberbullying can follow young people beyond the school gates. These risks are real and deserve attention from parents, schools and technology companies.

  However, social media also offers clear benefits. It allows young people to stay in touch with friends and family, including those who live far away. For teenagers who feel isolated, such as those with rare illnesses or minority identities, online communities can provide valuable support. Social platforms have also become important tools for learning and creativity: students share study resources, practise languages and publish their own music, videos and writing.

  The key factor is how social media is used. Education about digital literacy, sensible time limits and better safety features can reduce the harms while preserving the advantages.

  In conclusion, social media presents genuine risks, but describing its effect as mostly negative overlooks the connection, support and creativity it offers many young people.
