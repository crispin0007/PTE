prompt: Some people think that the government should be responsible for people's health, while others
  believe individuals are responsible for their own health. Discuss both views and give your own opinion.
sample_answer: |-
  Who should be responsible for keeping people healthy is a long-standing debate. While individuals clearly make choices that affect their health, I believe governments also have an essential role, because many health factors lie beyond personal control.

  Those who emphasise individual responsibility argue that health depends largely on lifestyle. People decide what they eat, whether they exercise and whether they smoke. From this perspective, expecting the state to manage these decisions is both costly and intrusive, and personal responsibility encourages people to look after themselves.

  However, others point out that personal choices are shaped by circumstances. A family living in an area with no affordable fresh food or safe places to exercise has fewer healthy options. Moreover, some threats to health, such as air pollution, infectious diseases and unsafe food, can only be tackled collectively. Government measures such as vaccination programmes, clean water and tobacco taxes have saved millions of lives.

  In my opinion, responsibility should be shared. Governments should create conditions that make healthy choices easy and affordable, through public healthcare, education and regulation, while individuals should make sensible use of these opportunities.

  In conclusion, neither side alone can guarantee good health; the best outcomes come when public policy and personal effort support each other.
