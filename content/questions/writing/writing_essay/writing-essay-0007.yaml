prompt: Tourism brings economic benefits to many countries, but it can also damage the environment and
  local cultures. Discuss both sides and give your opinion.
sample_answer: |-
  Tourism is one of the world's largest industries, providing income and employment for millions of people. However, its rapid growth has also placed pressure on natural environments and local communities. In my view, tourism remains beneficial overall, provided it is managed sustainably.

  The economic advantages are significant. Tourism creates jobs in hotels, restaurants and transport, and it often brings foreign currency to developing countries with few other export industries. Income from visitors can also fund the protection of heritage sites and national parks, giving communities a reason to preserve them.

  On the other hand, uncontrolled tourism can cause serious harm. Popular destinations may suffer from overcrowding, pollution and pressure on water supplies, while fragile ecosystems such as coral reefs can be damaged by careless visitors. Local cultures may also be affected when traditions are turned into performances for tourists or when rising property prices push residents out of historic city centres.

  These problems can be reduced through careful policies. Some cities limit visitor numbers or charge tourist taxes, and community-based tourism allows local people to keep control over how their culture is presented.

  In conclusion, tourism offers valuable economic opportunities, but its costs are real. With sensible regulation and local involvement, its benefits can be enjoyed without sacrificing the places that attract visitors in the first place.
