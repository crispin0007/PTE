prompt: Some people think that all university students should study subjects outside their main field,
  such as history or the arts. To what extent do you agree or disagree?
sample_answer: |-
  Universities increasingly debate whether students should focus entirely on their chosen field or take courses in other disciplines. I largely agree that students benefit from studying beyond their specialism, although such requirements should be flexible.

  The strongest argument for broader study is that it develops skills specialists need. Engineering students who take a history or philosophy course learn to evaluate arguments and consider ethical consequences, which are vital when designing technologies that affect society. Similarly, arts students who study basic statistics become better at interpreting evidence. Employers frequently say they value graduates who can think critically and communicate across disciplines.

  Broader study can also help students discover new interests. Many people change careers several times, and exposure to different subjects can prepare them for that reality. It may even improve their main studies, since ideas from one field often inspire innovation in another.

  However, compulsory courses can be a burden, particularly in demanding programmes such as medicine, where students already have heavy workloads. Requirements should therefore be modest and allow students to choose subjects that genuinely interest them.

  In conclusion, studying outside one's main field produces more adaptable and thoughtful graduates, provided that universities design such requirements with flexibility and respect for students' priorities.
