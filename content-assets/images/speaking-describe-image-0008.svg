<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>The water cycle</title><rect width="640" height="420" fill="#ffffff"/><text x="320.0" y="32" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#111">The water cycle</text><rect x="27.0" y="170" width="130" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="92.0" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Step 1</text><text x="92.0" y="207.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">Evaporation from</text><text x="92.0" y="223.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">oceans</text><line x1="161.0" y1="210.0" x2="173.0" y2="210.0" stroke="#333" stroke-width="2"/><path d="M173.0,205.0 L178.0,210.0 L173.0,215.0 Z" fill="#333"/><rect x="179.0" y="170" width="130" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="244.0" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Step 2</text><text x="244.0" y="207.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">Condensation</text><text x="244.0" y="223.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">into clouds</text><line x1="313.0" y1="210.0" x2="325.0" y2="210.0" stroke="#333" stroke-width="2"/><path d="M325.0,205.0 L330.0,210.0 L325.0,215.0 Z" fill="#333"/><rect x="331.0" y="170" width="130" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="396.0" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Step 3</text><text x="396.0" y="207.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">Precipitation as</text><text x="396.0" y="223.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">rain</text><line x1="465.0" y1="210.0" x2="477.0" y2="210.0" stroke="#333" stroke-width="2"/><path d="M477.0,205.0 L482.0,210.0 L477.0,215.0 Z" fill="#333"/><rect x="483.0" y="170" width="130" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="548.0" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Step 4</text><text x="548.0" y="207.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">Runoff into</text><text x="548.0" y="223.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111">rivers</text><text x="628" y="412" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#666">Diagram created for openpte practice</text></svg>