# The whole stack on one machine: PostgreSQL, the API, speech scoring, grammar checking and the
# web app.
#
#   ./scripts/selfhost-init.sh   # once: writes .env with fresh secrets
#   docker compose up -d --build
#
# Web: http://localhost:8080  API: http://localhost:3000/health
# For a public server with HTTPS, set the domains in .env and add --profile https.
# The full guide is docs/SELF_HOST.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openpte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpte}
      POSTGRES_DB: openpte
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openpte']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://openpte:${POSTGRES_PASSWORD:-openpte}@db:5432/openpte
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      CORS_ORIGIN: ${PUBLIC_WEB_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run ./scripts/selfhost-init.sh first, or set BETTER_AUTH_SECRET in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-openpte <no-reply@localhost>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      INCLUDE_UNREVIEWED: ${INCLUDE_UNREVIEWED:-1}
      INSTITUTE_CREATION: ${INSTITUTE_CREATION:-anyone}
      SINGLE_INSTITUTE_NAME: ${SINGLE_INSTITUTE_NAME:-}
      SPEECH_URL: http://speech:8000
      LANGUAGETOOL_URL: http://languagetool:8010
      SPEECH_TOKEN: ${SPEECH_TOKEN:-}
      SPEECH_DAILY_LIMIT: ${SPEECH_DAILY_LIMIT:-30}
      RECORDINGS_DIR: /data
    volumes:
      - recordings:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      speech:
        condition: service_started
      languagetool:
        condition: service_started
    ports:
      - '3000:3000'

  # Speech recognition and pronunciation scoring for speaking answers, on CPU. On first start it
  # downloads Whisper (about 250 MB) and the phoneme model (about 1.2 GB) into the models volume.
  # For a GPU, add -f docker-compose.gpu.yml.
  speech:
    build: services/speech
    restart: unless-stopped
    environment:
      SPEECH_TOKEN: ${SPEECH_TOKEN:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      WHISPER_THREADS: ${SPEECH_THREADS:-2}
      PHONEME_THREADS: ${SPEECH_THREADS:-2}
      PRONUNCIATION: ${PRONUNCIATION:-on}
      BROWSER_MODEL: ${BROWSER_MODEL:-on}
    volumes:
      - models:/models
      # A small copy of the phoneme model that the web app serves for the in-browser check.
      - browser-model:/browser-model
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health")',
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s

  # Grammar checking for Writing answers (LanguageTool, LGPL). About 1 GB of memory.
  languagetool:
    image: erikvl87/languagetool:6.8
    restart: unless-stopped
    environment:
      Java_Xms: 256m
      Java_Xmx: 1g

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
        OPENPTE_INCLUDE_UNREVIEWED: ${INCLUDE_UNREVIEWED:-1}
        VITE_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - browser-model:/usr/share/nginx/html/phonemes:ro
    ports:
      - '8080:80'

  # HTTPS for a public server: Caddy gets and renews certificates for both domains.
  caddy:
    image: caddy:2-alpine
    profiles: ['https']
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - web
      - api

volumes:
  db-data:
  recordings:
  models:
  browser-model:
  caddy-data:
